BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "adcs"
BBFILE_PATTERN_adcs = "^${LAYERDIR}/"
BBFILE_PRIORITY_adcs = "10"

# Application layer: flight software + image. Board support (machine,
# U-Boot, kernel config, device tree) lives in meta-beaglebone-bsp.
LAYERDEPENDS_adcs = "core"
LAYERSERIES_COMPAT_adcs = "whinlatter"
